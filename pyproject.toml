[tool.uv.sources]
puda = { git = "https://github.com/PUDAP/puda.git", rev = "cf42ae01c8b976abd83dacb629909b4f539489e0", subdirectory = "libs/python-sdk" }

[project]
name = "edge-python-gui-template"
authors = [{ name = "zhao" }]
version = "0.1.0"
description = "PUDA GUI driver template — controls any desktop instrument software via Hermes computer use (cua-driver MCP), on Windows or Linux (X11)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # PUDA edge framework
    "puda==0.0.19",
    # Settings / config
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    # MCP client — talks to cua-driver stdio server
    "mcp>=1.0.0",
]
